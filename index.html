<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2f6b3a">

<meta name="apple-mobile-web-app-title" content="Mis trabajos">

<title>Mis trabajos</title>
<style>
:root{--verde:#2f6b3a;--verde2:#e6f0e7;--verdeT:#2f6b3a;--tinta:#1d2420;--gris:#6b746e;--linea:#dfe5e0;--fondo:#f4f6f3;--tarjeta:#ffffff;--suave:#eef1ee;--campo:#cdd5cf;
  --rojo:#b3362b;--rojoT:#b3362b;--naranja:#c4721f;--curso:#fff7ec;--cursoL:#f0c48c;--nota:#eef4ff;--notaL:#cfe0ff;--notaT:#24467a;--hecho:#f1f7f2;--aviso:#1d2420;--avisoT:#ffffff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--verde:#3f8a4c;--verde2:#1f3324;--verdeT:#8fd19a;--tinta:#e7ece8;--gris:#9aa59d;--linea:#2c342e;--fondo:#121613;--tarjeta:#1b211d;--suave:#252c27;--campo:#3a443d;
  --rojo:#c4473b;--rojoT:#f08b80;--naranja:#f0a65a;--curso:#2c2116;--cursoL:#6b4a24;--nota:#17243a;--notaL:#2a4268;--notaT:#b8d0f5;--hecho:#18241b;--aviso:#e7ece8;--avisoT:#121613;color-scheme:dark}}
:root[data-theme="dark"]{--verde:#3f8a4c;--verde2:#1f3324;--verdeT:#8fd19a;--tinta:#e7ece8;--gris:#9aa59d;--linea:#2c342e;--fondo:#121613;--tarjeta:#1b211d;--suave:#252c27;--campo:#3a443d;
  --rojo:#c4473b;--rojoT:#f08b80;--naranja:#f0a65a;--curso:#2c2116;--cursoL:#6b4a24;--nota:#17243a;--notaL:#2a4268;--notaT:#b8d0f5;--hecho:#18241b;--aviso:#e7ece8;--avisoT:#121613;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--fondo);color:var(--tinta);font:17px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--verde);color:#fff;display:flex;align-items:center;gap:10px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header h1{font-size:21px;margin:0;flex:1;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button{background:rgba(255,255,255,.16);color:#fff;border:0;border-radius:10px;padding:8px 12px;font:inherit;font-size:16px}
main{padding-block:12px calc(90px + env(safe-area-inset-bottom,0px));padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
h2{font-size:14px;color:var(--gris);text-transform:uppercase;letter-spacing:.05em;margin:18px 4px 8px}
.tarjeta{background:var(--tarjeta);border:1px solid var(--linea);border-radius:14px;padding:14px;margin-bottom:10px}
.btn{border:0;border-radius:12px;padding:10px 16px;font:inherit;font-weight:600;background:var(--verde2);color:var(--verdeT);cursor:pointer}
.btn.prin{background:var(--verde);color:#fff}
.btn.rojo{background:var(--rojo);color:#fff}
.btn.suave{background:var(--suave);color:var(--tinta)}
.btn.ancho{width:100%;padding:14px}
.fila{display:flex;gap:10px;flex-wrap:wrap}.fila>.btn{flex:1}
.vacio{color:var(--gris);text-align:center;padding:28px 10px;background:var(--tarjeta);border:1px dashed var(--linea);border-radius:14px}
.debe{color:var(--rojoT);font-weight:700}.aldia{color:var(--verdeT);font-weight:600}
.num{font-variant-numeric:tabular-nums}

/* hoy */
.dia{display:flex;align-items:center;gap:8px;margin:2px 0 10px}
.dia button{width:42px;height:42px;border-radius:12px;border:1px solid var(--linea);background:var(--tarjeta);color:var(--tinta);font-size:22px;line-height:1}
.dia .t{flex:1;text-align:center}
.dia .q{font-size:13px;color:var(--gris);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.dia .f{font-size:22px;font-weight:700}
.semana{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:14px}
.semana button{border:1px solid var(--linea);background:var(--tarjeta);color:var(--tinta);border-radius:12px;padding:6px 0 7px;font:inherit;display:flex;flex-direction:column;align-items:center;gap:1px}
.semana .l{font-size:12px;color:var(--gris);font-weight:600}.semana .n{font-size:17px;font-weight:700}
.semana .p{display:flex;gap:2px;height:6px}.semana .p i{width:5px;height:5px;border-radius:50%;background:var(--verde)}
.semana button.sel{background:var(--verde);border-color:var(--verde);color:#fff}.semana button.sel .l{color:rgba(255,255,255,.8)}.semana button.sel .p i{background:#fff}
.semana button.hoy:not(.sel){border:2px solid var(--verde)}
.resumen{display:flex;justify-content:space-between;margin:0 4px 8px;color:var(--gris);font-size:15px}.resumen b{color:var(--tinta)}
.tr{display:flex;gap:12px;background:var(--tarjeta);border:1px solid var(--linea);border-radius:14px;padding:12px 12px 12px 0;margin-bottom:10px}
.tr .hora{width:66px;flex:none;text-align:right;padding:2px 10px 0 0;border-right:3px solid var(--linea)}
.tr .hora .a{font-weight:700}.tr .hora .b{color:var(--gris);font-size:14px}
.tr .cuerpo{flex:1;min-width:0}
.tr .nom{font-weight:650;font-size:18px}
.sub{color:var(--gris);font-size:15px}
.tr .acc{margin-top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tr.curso{background:var(--curso);border-color:var(--cursoL)}.tr.curso .hora{border-right-color:var(--naranja)}
.crono{font-size:24px;font-weight:700;color:var(--naranja)}
.tr.hecho{background:var(--hecho)}.tr.hecho .hora{border-right-color:var(--verde)}
.ok{color:var(--verdeT);font-weight:650}
.imp{font-weight:700;margin-left:auto}
.pie{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.caja{background:var(--tarjeta);border:1px solid var(--linea);border-radius:14px;padding:12px}
.caja .k{font-size:13px;color:var(--gris);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.caja .v{font-size:24px;font-weight:700}.caja .s{font-size:13px;color:var(--gris)}

/* clientes */
.cli{display:flex;align-items:center;gap:12px;cursor:pointer}
.cli .info{flex:1;min-width:0}.cli .nom{font-weight:650;font-size:18px}
.cli .der{text-align:right;white-space:nowrap}
.buscar{position:relative;margin-bottom:12px}
.buscar input{padding-left:40px;border-radius:12px;background:var(--tarjeta)}
.buscar svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--gris);pointer-events:none}
.sinres{display:none}
.olvido{background:var(--curso);border:2px solid var(--naranja);color:var(--tinta);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.opc .sw{margin-left:8px}
.btn.mini{padding:7px 12px;font-size:15px;white-space:nowrap;text-decoration:none;display:inline-block}
.btn.mas{padding:7px 10px;margin-left:auto;line-height:1;background:transparent}
.tr.no,.tr.movido{opacity:.65;background:var(--suave)}
.seg.tres{grid-template-columns:1fr 1fr 1fr}.seg.tres button{font-size:14px;padding:9px 2px}
.fijoT{background:var(--suave);border-color:transparent;font-weight:700;font-size:20px;text-align:center;pointer-events:none}
.elegir{display:flex;flex-wrap:wrap;gap:6px;max-height:190px;overflow-y:auto}
.chip.elige{cursor:pointer;font-size:15px;padding:8px 11px;margin:0;border:2px solid transparent;background:var(--suave);color:var(--tinta)}
.chip.elige.si{border-color:var(--verde);background:var(--verde2);color:var(--verdeT)}
.mesd{padding:0 14px}
.mesd summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 0;cursor:pointer}
.mesd summary::-webkit-details-marker{display:none}
.mesd summary::after{content:"›";font-size:22px;color:var(--gris);transition:transform .15s;margin-left:4px}
.mesd[open] summary::after{transform:rotate(90deg)}
.mesd[open] summary{border-bottom:1px solid var(--linea)}
.mesd summary .sub{margin-left:auto}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--suave);border-radius:12px;padding:4px;margin:14px 0 12px}
.seg button{border:0;background:none;font:inherit;font-weight:600;color:var(--gris);padding:9px 0;border-radius:9px;cursor:pointer}
.seg button.si{background:var(--tarjeta);color:var(--tinta);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.horario{border:1px solid var(--campo);border-radius:12px;overflow:hidden}
.hd{display:flex;align-items:center;gap:10px;padding:8px 12px;min-height:52px;border-top:1px solid var(--linea)}
.hd:first-child{border-top:0}
.hd .dn{width:44px;font-weight:600;flex:none}
.hd.off .dn{color:var(--gris);font-weight:500}
.hd .hh{display:flex;align-items:center;gap:6px;flex:1;min-width:0;font-size:15px;color:var(--gris)}
.hd .hh input{padding:7px 6px;width:auto;flex:1;min-width:0;font-size:16px}
.sw{margin-left:auto;width:48px;height:28px;border-radius:14px;background:var(--campo);position:relative;border:0;flex:none;cursor:pointer}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.sw.si{background:var(--verde)}.sw.si::after{left:23px}
[hidden]{display:none!important}
.flecha{color:var(--gris);font-size:22px}
.saldo{font-size:32px;font-weight:700}
.mov{display:flex;justify-content:space-between;align-items:center;padding:11px 2px;border-top:1px solid var(--linea);gap:10px}
.mov:first-child{border-top:0}
.mov .d{color:var(--gris);font-size:14px}
.mov .imp.cobro{color:var(--verdeT)}
.fijo{display:flex;align-items:center;gap:10px;padding:9px 2px;border-top:1px solid var(--linea)}.fijo:first-child{border-top:0}
.fijo .dd{font-weight:650;width:92px}
.chip{display:inline-block;background:var(--verde2);color:var(--verdeT);border-radius:8px;padding:3px 8px;font-size:13px;font-weight:600;margin:2px 4px 0 0}
.opc{display:flex;align-items:center;gap:12px;padding:14px 4px;border-top:1px solid var(--linea);cursor:pointer}.opc:first-child{border-top:0}
.opc .ic{width:36px;height:36px;border-radius:10px;background:var(--verde2);color:var(--verdeT);display:grid;place-items:center;font-size:18px;flex:none}
.opc .tx{flex:1}.opc .tx b{display:block;font-weight:650}.opc .tx span{color:var(--gris);font-size:14px}
.opc.peligro .ic{background:var(--curso);color:var(--rojoT)}.opc.peligro b{color:var(--rojoT)}

/* hoja */
#capa{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;z-index:20;align-items:flex-end;justify-content:center}
#capa.ver{display:flex}
#hoja{background:var(--tarjeta);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding-block:18px calc(28px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-height:90vh;overflow:auto}
#hoja h3{margin:0 0 6px;font-size:20px}
label{display:block;font-size:14px;color:var(--gris);margin:12px 2px 4px}
input,textarea{width:100%;font:inherit;padding:12px;border:1px solid var(--campo);border-radius:10px;background:var(--tarjeta);color:var(--tinta)}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cuantos{display:flex;gap:8px;margin:8px 0 4px}
.cuantos button,.dsem button{flex:1;padding:14px 0;font-size:20px;font-weight:700;border-radius:12px;border:2px solid var(--linea);background:var(--tarjeta);color:var(--tinta)}
.dsem{display:flex;gap:6px;margin-top:6px}.dsem button{font-size:16px;padding:10px 0}
.cuantos button.si,.dsem button.si{border-color:var(--verde);background:var(--verde2);color:var(--verdeT)}
.nota{background:var(--nota);border:1px solid var(--notaL);color:var(--notaT);border-radius:12px;padding:10px 12px;font-size:14px;margin:10px 0}
.barra{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--tarjeta);border-top:1px solid var(--linea);padding-bottom:env(safe-area-inset-bottom,0px)}
.barra .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.barra button{border:0;background:none;color:var(--gris);font:inherit;font-size:12px;font-weight:600;padding:8px 0 9px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.barra svg{width:26px;height:26px}
.barra button.si{color:var(--verdeT)}
#aviso{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--aviso);color:var(--avisoT);padding:12px 18px;border-radius:12px;font-size:15px;display:none;z-index:30;max-width:90vw;text-align:center}
.tr.extra .nom::after{content:""}
.olvido .sub{color:inherit}
.copia{display:flex;align-items:center;gap:10px}
.copia .btn{white-space:nowrap}
</style>
</head>
<body>

<!-- formulario para que Netlify reciba los fichajes de las casas enlazadas (no se ve) -->
<form name="fichaje" method="POST" data-netlify="true" netlify-honeypot="trampa" hidden><input name="trampa"><input name="id"><input name="casa"><input name="tipo"><input name="hora"><input name="personas"><input name="lat"><input name="lon"><input name="prec"></form>
<script>
"use strict";
// ======================= datos (solo en este móvil) =======================
const CLAVE = "mt_datos", COLA = "mt_cola";
// buzón de Netlify cuando la app está en otro sitio (GitHub); Pagos Particulares lo rellena al publicar. Vacío = este mismo sitio.
const BUZON = "https://mis-trabajos-v86b.netlify.app/";
const AVISOS = (BUZON || (location.origin + "/")) + ".netlify/functions/avisos";

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const pad = n => String(n).padStart(2,"0");
const iso = d => d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate());
const deIso = s => new Date(s + "T12:00");
const hoy = () => { const d = new Date(); d.setHours(12,0,0,0); return d; };
const hhmm = d => pad(d.getHours()) + ":" + pad(d.getMinutes());
const mins = h => { const [a,b] = String(h).split(":").map(Number); return a*60 + (b||0); };
const dow = d => (d.getDay()+6)%7;

function cargar(){
  let d = null; try{ d = JSON.parse(localStorage.getItem(CLAVE)); }catch(e){}
  if(!d || !d.clientes) d = {clientes:[], trabajos:[], cobros:[]};
  if(d.v !== 2){
    // versión 1 → 2: los trabajos guardaban la hora en milisegundos y no había horarios
    d.clientes.forEach(c => { c.dias = c.dias || {}; c.freq = c.freq || 1; c.dir = c.dir || ""; c.hist = c.hist || []; c.personas = c.personas || 1; });
    d.trabajos.forEach(t => { if(typeof t.ini === "number") t.ini = hhmm(new Date(t.ini)); if(typeof t.fin === "number") t.fin = hhmm(new Date(t.fin)); });
    d.enCurso = null; d.v = 2;
  }
  d.cobros = d.cobros || []; d.estado = d.estado || {}; d.extras = d.extras || [];
  if(d.avisos === undefined) d.avisos = true;
  if(!d.disp) d.disp = uid() + uid();
  if(!d.creado) d.creado = Date.now();
  return d;
}
let D = cargar();
function guardar(){ try{ localStorage.setItem(CLAVE, JSON.stringify(D)); }catch(e){ avisar("No he podido guardar: el móvil no deja"); } }

const cli = id => D.clientes.find(c => c.id === id);
const eur = n => { const r = Math.round(n*100)/100, [e,dd] = Math.abs(r).toFixed(2).split("."); return (r<0?"−":"") + e.replace(/\B(?=(\d{3})+(?!\d))/g,".") + (dd!=="00" ? ","+dd : "") + " €"; };
const hTxt = n => (Math.round(n*100)/100).toLocaleString("es-ES") + " h";
const leerNum = s => { s = String(s||"").replace(/€/g,"").replace(/\s/g,"").replace(",","."); const v = parseFloat(s); return isFinite(v) ? v : NaN; };
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sinAcentos = t => String(t||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const DIAS = ["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"], CORTO = ["L","M","X","J","V","S","D"];
const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const fTxt = d => DIAS[dow(d)].toLowerCase() + " " + d.getDate() + " de " + MESES[d.getMonth()];
const fCorta = s => { const d = deIso(s); return pad(d.getDate()) + "/" + pad(d.getMonth()+1) + (d.getFullYear() !== hoy().getFullYear() ? "/" + String(d.getFullYear()).slice(2) : ""); };
const mesNombre = k => { const [y,m] = k.split("-").map(Number); const n = MESES[m-1]; return n[0].toUpperCase() + n.slice(1) + (y !== hoy().getFullYear() ? " " + y : ""); };
const FREQ = {1:"Cada semana", 2:"Cada 2 semanas", mes:"Una vez al mes"};
const personasTxt = n => n + (n>1 ? " personas" : " persona");
function avisar(t){ const a = document.getElementById("aviso"); a.textContent = t; a.style.display = "block"; clearTimeout(avisar.t); avisar.t = setTimeout(() => a.style.display = "none", 3000); }

// ======================= agenda: qué toca cada día =======================
function lunesDe(d){ const l = new Date(d); l.setHours(12,0,0,0); l.setDate(l.getDate() - dow(l)); return l; }
function toca(c, d){
  if(!c.dias || !c.dias[dow(d)]) return false;
  if(c.freq === 2 && c.desde) return Math.round((lunesDe(d) - lunesDe(deIso(c.desde))) / (7*864e5)) % 2 === 0;
  if(c.freq === "mes") return d.getDate() <= 7;
  return true;
}
// trabajos de un día: los fijos que tocan y los que se han pasado a ese día
function delDia(d){
  const f = iso(d);
  return [
    ...D.clientes.filter(c => toca(c, d)).map(c => ({c, h: c.dias[dow(d)], k: f + "|" + c.id})),
    ...D.extras.filter(x => x.fecha === f && cli(x.cli)).map(x => ({c: cli(x.cli), h: [x.ini, x.fin], k: f + "|" + x.cli + "|" + x.id, extra: x}))
  ].sort((a,b) => mins(a.h[0]) - mins(b.h[0]));
}
const cuenta = x => { const e = D.estado[x.k]; return !e || (e.st !== "no" && e.st !== "movido"); };
const fijosTxt = c => Object.keys(c.dias||{}).sort().map(k => DIAS[k].slice(0,3).toLowerCase() + " " + c.dias[k][0] + "–" + c.dias[k][1] + (c.freq===2 ? " · cada 2 sem." : c.freq==="mes" ? " · 1 al mes" : ""));

// ======================= dinero =======================
function debe(id){ let t = 0; D.trabajos.forEach(x => { if(x.cli===id) t += x.importe; }); D.cobros.forEach(x => { if(x.cli===id) t -= x.importe; }); return Math.round(t*100)/100; }
// meses de un cliente: lo apuntado y cuánto está pagado (lo que paga tapa primero lo más antiguo)
function mesesDe(id){
  const ms = {};
  for(const t of D.trabajos.filter(t => t.cli===id)){ const m = t.fecha.slice(0,7); (ms[m] = ms[m] || {m, imp:0, n:0, pag:0, el:null}); ms[m].imp += t.importe; if(!t.mat) ms[m].n++; }
  const l = Object.values(ms).sort((a,b) => a.m < b.m ? -1 : 1);
  const pagos = D.cobros.filter(c => c.cli===id).sort((a,b) => a.fecha < b.fecha ? -1 : 1);
  let resto = 0, pi = 0;
  for(const x of l){
    while(resto < x.imp - 0.001 && pi < pagos.length){ resto += pagos[pi].importe; x.el = pagos[pi].fecha; pi++; }
    x.pag = Math.min(resto, x.imp); resto -= x.pag; if(x.pag < 0.001) x.el = null;
  }
  return l.reverse();
}
function estadoMes(x){
  if(x.imp - x.pag < 0.01) return `<span class="aldia">✓ Pagado</span>${x.el ? `<div class="sub">el ${fCorta(x.el)}</div>` : ""}`;
  if(x.pag > 0.01) return `<span class="debe num">Faltan ${eur(x.imp-x.pag)}</span><div class="sub">pagó ${eur(x.pag)}</div>`;
  return `<span class="debe num">Debe ${eur(x.imp)}</span><div class="sub">sin pagar</div>`;
}

// ======================= casa enlazada (?casa=…) =======================
// Un cliente puede tener una «casa enlazada»: al empezar y terminar allí se le manda la hora, cuántos sois y dónde estáis. Nada más.
(function enlace(){
  const p = new URLSearchParams(location.search), casa = p.get("casa"); if(!casa) return;
  const nombre = (p.get("n") || "Casa").slice(0, 60);
  history.replaceState(null, "", location.pathname);
  if(D.clientes.some(c => c.casa === casa)) return;
  setTimeout(() => editarCliente(null, {nombre, casa}), 300);
})();
function ubicacion(){
  return new Promise(res => {
    if(!navigator.geolocation) return res(null);
    navigator.geolocation.getCurrentPosition(p => res(p.coords), () => res(null), {enableHighAccuracy:true, timeout:15000, maximumAge:60000});
  });
}
async function fichar(c, tipo, personas, ms, sinSitio){
  if(!c || !c.casa) return;
  const pos = sinSitio ? null : await ubicacion();
  const f = {id: uid(), casa: c.casa, tipo, hora: new Date(ms).toISOString(), personas: String(personas),
             lat: pos ? pos.latitude.toFixed(6) : "", lon: pos ? pos.longitude.toFixed(6) : "", prec: pos ? Math.round(pos.accuracy) : ""};
  const cola = leerCola(); cola.push(f); try{ localStorage.setItem(COLA, JSON.stringify(cola)); }catch(e){}
  await mandarCola();
}
function leerCola(){ try{ return JSON.parse(localStorage.getItem(COLA)) || []; }catch(e){ return []; } }
async function mandarCola(){
  let cola = leerCola(), quedan = [];
  for(const f of cola){
    try{
      const r = await fetch(BUZON || "/", {method:"POST", mode: BUZON ? "no-cors" : "cors", headers:{"Content-Type":"application/x-www-form-urlencoded"}, body: new URLSearchParams(Object.assign({"form-name":"fichaje"}, f)).toString()});
      if(!BUZON && !r.ok) quedan.push(f);   // con buzón aparte la respuesta no se puede leer: si no hay error de red, ha llegado
    }catch(e){ quedan.push(f); }
  }
  try{ localStorage.setItem(COLA, JSON.stringify(quedan)); }catch(e){}
  return quedan.length === 0;
}

// ======================= avisos «se te olvidó ■» =======================
// Al empezar se le dice al servidor a qué hora tenía que acabar (sin nombres); si a la hora siguiente sigue en marcha, avisa, y luego cada hora.
const puedeAvisar = () => "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
async function pedirAvisos(datos){
  const r = await fetch(AVISOS, {method:"POST", headers:{"Content-Type":"text/plain"}, body: JSON.stringify(datos)});
  if(!r.ok) throw new Error("avisos " + r.status); return r.json();
}
function b64(s){ s = s.replace(/-/g,"+").replace(/_/g,"/"); while(s.length % 4) s += "="; const b = atob(s), a = new Uint8Array(b.length); for(let i=0;i<b.length;i++) a[i] = b.charCodeAt(i); return a; }
async function suscripcion(){
  if(!puedeAvisar() || !D.avisos) return null;
  if(Notification.permission === "default"){ try{ await Notification.requestPermission(); }catch(e){} }
  if(Notification.permission !== "granted") return null;
  const reg = await navigator.serviceWorker.ready;
  let sub = await reg.pushManager.getSubscription();
  if(!sub){ const {clave} = await pedirAvisos({accion:"clave"}); sub = await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey: b64(clave)}); }
  return sub;
}
async function avisosEmpezar(){
  const e = D.enCurso, fin = finPrevisto(e); if(!fin) return;
  try{
    const sub = await suscripcion(); if(!sub) return;
    await pedirAvisos({accion:"empezar", id: D.disp, sub: sub.toJSON(), fin, iniTxt: hhmm(new Date(e.ini)), finTxt: e.pr[1]});
    D.avisoPendiente = null; guardar();
  }catch(err){}
}
async function avisosTerminar(){
  if(!puedeAvisar()) return;
  try{ await pedirAvisos({accion:"terminar", id: D.disp}); D.avisoPendiente = null; }catch(e){ D.avisoPendiente = "terminar"; }
  guardar();
}
window.addEventListener("online", () => { mandarCola(); if(D.avisoPendiente === "terminar" && !D.enCurso) avisosTerminar(); });
setTimeout(() => { mandarCola(); if(D.avisoPendiente === "terminar" && !D.enCurso) avisosTerminar(); }, 2000);

// ======================= trabajar =======================
// hora a la que tenía que acabar (ms): la del horario, o si empezó tarde, lo que dura después de empezar
function finPrevisto(e){
  if(!e || !e.pr) return null;
  const d = deIso(e.fecha); d.setHours(0, mins(e.pr[1]), 0, 0);
  return Math.max(d.getTime(), e.ini + (mins(e.pr[1]) - mins(e.pr[0])) * 60000);
}
function olvidado(){ const e = D.enCurso, f = finPrevisto(e); return f && Date.now() > f + 3600000 ? e : null; }
function empezar(k){
  if(D.enCurso){ hoja(`<h3>Antes termina el otro</h3><div class="sub">Tienes en marcha <b style="color:var(--tinta)">${esc((cli(D.enCurso.cli)||{}).nombre)}</b>. Pulsa ■ Terminar en ese trabajo y luego podrás empezar este.</div>
    <button class="btn prin ancho" style="margin-top:16px" onclick="cerrar()">Entendido</button>`); return; }
  const x = buscarK(k); if(!x) return;
  elegir.n = x.c.personas || 1;
  hoja(`<h3>Empezar en ${esc(x.c.nombre)}</h3><label>¿Cuántos sois?</label>
    <div class="cuantos">${[1,2,3,4,5].map(i=>`<button class="${i===elegir.n?"si":""}" onclick="elegir(this,${i})">${i}</button>`).join("")}</div>
    ${x.c.casa ? `<div class="nota">Se avisa a ${esc(x.c.nombre)} de la hora, cuántos sois y dónde estáis.</div>` : ""}
    <div class="fila" style="margin-top:14px"><button class="btn suave" onclick="cerrar()">Cancelar</button><button class="btn prin" onclick="empezarYa('${k}')">▶ Empezar</button></div>`);
}
function elegir(b, i){ elegir.n = i; b.parentNode.querySelectorAll("button").forEach(x => x.classList.toggle("si", x===b)); if(document.getElementById("tTot")) calc(); }
function buscarK(k){ const [f] = k.split("|"); return delDia(deIso(f)).find(x => x.k === k); }
function empezarYa(k){
  const x = buscarK(k); if(!x || D.enCurso) return;
  D.enCurso = {k, cli: x.c.id, fecha: k.split("|")[0], ini: Date.now(), personas: elegir.n, pr: [x.h[0], x.h[1]]};
  guardar(); cerrar(); pintar(); avisar("En marcha: " + x.c.nombre);
  avisosEmpezar();
  fichar(x.c, "llegada", elegir.n, D.enCurso.ini);
}
function terminar(){
  const e = D.enCurso; if(!e) return; const c = cli(e.cli);
  elegir.n = e.personas;
  const fin = new Date();
  hoja(`<h3>Terminar en ${esc(c ? c.nombre : "")}</h3>
    <div class="dos"><div><label>Empezasteis</label><input type="text" value="${hhmm(new Date(e.ini))}" readonly class="fijoT"></div><div><label>Termináis</label><input type="text" value="${hhmm(fin)}" readonly class="fijoT"></div></div>
    <label>¿Cuántos erais?</label>
    <div class="cuantos">${[1,2,3,4,5].map(i=>`<button class="${i===e.personas?"si":""}" onclick="elegir(this,${i})">${i}</button>`).join("")}</div>
    <div class="nota" id="tTot" style="font-size:16px"></div>
    <div class="fila" style="margin-top:6px"><button class="btn suave" onclick="cerrar()">Volver</button><button class="btn rojo" onclick="terminarYa(${fin.getTime()})">■ Terminar</button></div>`);
  calc();
}
const realDe = (ini, fin) => Math.max(0.25, Math.round((fin - ini) / 900000) / 4);   // en cuartos de hora
const contratado = (e, c) => e.pr ? (mins(e.pr[1]) - mins(e.pr[0])) / 60 * (c.personas || 1) : null;
function calc(){
  const e = D.enCurso, c = cli(e.cli), h = realDe(e.ini, Date.now()), n = elegir.n, ct = contratado(e, c);
  document.getElementById("tTot").innerHTML = `Habéis estado ${hTxt(h)} × ${personasTxt(n)} = ${hTxt(h*n)}` +
    (ct != null ? `<br><b>Se le cobra lo contratado: ${hTxt(ct)}</b>` : `<br><b>Se le cobra eso: ${hTxt(h*n)}</b>`);
}
function apuntar(e, finMs, personas){
  const c = cli(e.cli); if(!c) return;
  const real = realDe(e.ini, finMs) * personas, ct = contratado(e, c), horas = ct != null ? ct : real;
  const t = {id: uid(), cli: c.id, fecha: e.fecha, ini: hhmm(new Date(e.ini)), fin: hhmm(new Date(finMs)), personas, horas, real, importe: Math.round(horas * c.precio * 100)/100, k: e.k};
  D.trabajos.push(t); D.estado[e.k] = {st: "hecho", t: t.id}; D.enCurso = null;
  return c;
}
function terminarYa(finMs){
  const e = D.enCurso; if(!e) return;
  const c = apuntar(e, finMs, elegir.n);
  guardar(); cerrar(); pintar(); avisar("Apuntado" + (c ? " en " + c.nombre : ""));
  avisosTerminar(); fichar(c, "salida", elegir.n, finMs);
}
function terminarPrevisto(){
  const e = D.enCurso; if(!e) return;
  const d = deIso(e.fecha); d.setHours(0, mins(e.pr[1]), 0, 0);
  const finMs = Math.max(d.getTime(), e.ini + 60000);
  const c = apuntar(e, finMs, e.personas);
  guardar(); pintar(); avisar("Terminado a las " + hhmm(new Date(finMs)));
  avisosTerminar(); fichar(c, "salida", e.personas, finMs, true);
}
function reloj(){ document.querySelectorAll(".crono").forEach(r => { if(!D.enCurso) return; const m = Math.floor((Date.now() - D.enCurso.ini)/60000); r.textContent = Math.floor(m/60) + ":" + pad(m%60); }); }
setInterval(reloj, 15000);
document.addEventListener("visibilitychange", () => { if(!document.hidden) pintar(); });

    <div class="elegir">${["Lluvia","Festivo","Vacaciones","Lo ha anulado el cliente","Otro"].map(m=>`<span class="chip elige" onclick="cambiarDia.m='${m}';document.querySelectorAll('.elige').forEach(e=>e.classList.toggle('si',e===this))">${m}</span>`).join("")}</div>

    <button class="btn prin ancho" style="margin-top:10px" onclick="pasarDia('${k}')">↷ Pasarlo a ese día</button>
    <button class="btn suave ancho" style="margin-top:14px" onclick="cerrar()">Cancelar</button>`);
}
function noSeVa(k){ D.estado[k] = {st:"no", motivo: cambiarDia.m}; guardar(); cerrar(); pintar(); avisar("Apuntado: no se va"); }
function pasarDia(k){
  const x = buscarK(k), v = document.getElementById("cdD").value; if(!x) return; if(!v){ avisar("Elige el día"); return; }
  const ini = document.getElementById("cdH").value || x.h[0], dur = mins(x.h[1]) - mins(x.h[0]), f = mins(ini) + dur;
  const fin = pad(Math.floor(f/60) % 24) + ":" + pad(f % 60);
  D.extras.push({id: uid(), cli: x.c.id, fecha: v, ini, fin, de: k});
  D.estado[k] = {st:"movido", a: v};
  guardar(); cerrar(); pintar(); avisar("Pasado al " + fTxt(deIso(v)));
}
function deshacer(k){
  D.extras = D.extras.filter(x => x.de !== k);
  delete D.estado[k]; guardar(); pintar();
}

function guardarCliente(id){
  const v = n => document.getElementById(n).value.trim();

  else D.clientes.push(Object.assign({id: uid(), hist: [], casa: editarCliente.casa || undefined}, datos));

function borrarCliente(id){

    D.extras = D.extras.filter(x => x.cli !== id); if(D.enCurso && D.enCurso.cli === id){ D.enCurso = null; avisosTerminar(); }

function nombreCopia(){ return "Mis trabajos - copia " + iso(hoy()) + ".json"; }
async function guardarCopia(){
  const txt = JSON.stringify(Object.assign({app:"Mis trabajos", copia: new Date().toISOString()}, D), null, 1);
  const f = new File([txt], nombreCopia(), {type:"application/json"});
  try{ if(navigator.canShare && navigator.canShare({files:[f]})){ await navigator.share({files:[f], title:"Copia de Mis trabajos"}); D.ultimaCopia = Date.now(); guardar(); pintar(); return; } }catch(e){ if(e && e.name === "AbortError") return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(f); a.download = nombreCopia(); document.body.appendChild(a); a.click(); a.remove();
  D.ultimaCopia = Date.now(); guardar(); pintar(); avisar("Copia guardada en Descargas");
}
function recuperarCopia(input){
  const f = input.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const d = JSON.parse(r.result); if(!d.clientes || !d.trabajos) throw 0;
      preguntar("¿Cambiar todo lo de ahora por la copia del " + (d.copia ? new Date(d.copia).toLocaleDateString("es-ES") : "archivo") + "?", "Recuperar", () => {
        const disp = D.disp; delete d.app; delete d.copia;
        try{ localStorage.setItem(CLAVE, JSON.stringify(d)); }catch(e){}
        D = cargar(); D.disp = disp; D.ultimaCopia = Date.now(); guardar(); historia = []; vista = "hoy"; pintar(); avisar("Copia recuperada"); });
    }catch(e){ avisar("Ese archivo no es una copia de Mis trabajos"); }
  };
  r.readAsText(f);
}
function borrarTodo(){
  preguntar("¿Borrar todo? La app se queda vacía, como recién instalada. Si no tienes copia, no se puede recuperar.", "Borrar todo", () => {
    const disp = D.disp, avisos = D.avisos; if(D.enCurso) avisosTerminar();
    D = {v:2, clientes:[], trabajos:[], cobros:[], estado:{}, extras:[], enCurso:null, disp, avisos, creado: Date.now()};
    try{ localStorage.removeItem(COLA); }catch(e){}
    guardar(); historia = []; vista = "hoy"; sel = hoy(); pintar(); avisar("Borrado todo");
  });
}
async function cambiarAvisos(b){
  D.avisos = !D.avisos; guardar();
  if(D.avisos && puedeAvisar() && Notification.permission === "default"){ try{ await Notification.requestPermission(); }catch(e){} }
  if(!D.avisos) avisosTerminar(); else if(D.enCurso) avisosEmpezar();
  pintar();
}

let vista = "hoy", actual = null, historia = [], sel = hoy(), modoPagos = "cli";
const LUPA = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>`;

function vHoy(){

  const l = delDia(sel); let h = "", horas = 0, hechos = 0, cuentan = 0;
  for(const {c, h:[a,b], k, extra} of l){
    const e = D.estado[k], st = D.enCurso && D.enCurso.k === k ? "curso" : e && e.st, dur = (mins(b)-mins(a))/60, tot = dur * (c.personas||1);

    else { acc = (dif <= 0 ? `<button class="btn ${D.enCurso ? "suave" : "prin"}" ${D.enCurso ? 'style="opacity:.55"' : ""} onclick="empezar('${k}')">▶ Empezar</button>` : `<span class="sub">Previsto</span>`) + mas; sub = personasTxt(c.personas||1) + " · " + hTxt(dur) + " → " + hTxt(tot); }
    h += `<div class="tr ${st||""}"><div class="hora num"><div class="a">${a}</div><div class="b">${b}</div></div>
      <div class="cuerpo"><div class="nom">${esc(c.nombre)}${extra ? ' <span class="chip" style="font-size:12px">cambiado de día</span>' : ""}</div><div class="sub">${sub}</div><div class="acc">${acc}</div></div></div>`;
  }
  // trabajos apuntados a mano ese día
  const sueltos = D.trabajos.filter(t => t.fecha === iso(sel) && !t.k && !t.mat && cli(t.cli));
  for(const t of sueltos) h += `<div class="tr hecho"><div class="hora num"><div class="a">${t.ini || "—"}</div><div class="b">${t.fin || ""}</div></div>

  const ol = olvidado(), oc = ol && cli(ol.cli);

    <button class="btn ancho" style="margin-top:4px;background:var(--nota);color:var(--notaT);border:2px dashed var(--notaL)" onclick="trabajoMano()">＋ Trabajo fuera de lo previsto</button>

    + (modoPagos === "mes" ? `<div class="tarjeta">${porMes()}</div>` : (D.clientes.length > 5 ? buscador() : "") + (l.map(c => { const d = debe(c.id);

function porMes(){

function vCuenta(c){

}
function hechosPorMes(c){
  const l = D.trabajos.filter(t => t.cli===c.id && !t.mat).sort((a,b) => a.fecha < b.fecha ? 1 : -1);
  if(!l.length) return `<div class="tarjeta"><div class="sub">Aún ninguno.</div></div>`;
  const meses = [...new Set(l.map(t => t.fecha.slice(0,7)))];
  return meses.map((m,i) => { const ts = l.filter(t => t.fecha.slice(0,7) === m), h = ts.reduce((s,t) => s + t.horas, 0);
    return `<details class="tarjeta mesd"${i===0?" open":""}><summary><b>${mesNombre(m)}</b><span class="sub">${ts.length} ${ts.length===1?"trabajo":"trabajos"} · <b style="color:var(--tinta)">${hTxt(h)}</b></span></summary>
      ${ts.map(t => `<div class="mov"><div><div>${fCorta(t.fecha)}${t.ini ? ` · ${t.ini} a ${t.fin}` : ""}</div><div class="d">${t.personas ? personasTxt(t.personas) : ""}${t.real != null && Math.abs(t.real - t.horas) > 0.01 ? ` · estuvisteis ${hTxt(t.real)}` : ""}${t.nota ? " · " + esc(t.nota) : ""}</div></div><div class="imp num">${hTxt(t.horas)}</div></div>`).join("")}</details>`; }).join("");
}
function vCliente(c){
  const tel = (c.tel||"").replace(/[^\d+]/g,""), wa = tel.replace(/^\+/,"").length === 9 ? "34" + tel : tel.replace(/^\+/,"");
  return `<div class="tarjeta">
      <div class="fijo" style="align-items:flex-start"><span class="dd">Teléfono</span><span style="flex:1;min-width:0">${c.tel ? esc(c.tel) + `<div class="fila" style="margin-top:8px"><a class="btn mini" href="tel:${esc(tel)}">📞 Llamar</a><a class="btn mini" href="https://wa.me/${esc(wa)}" target="_blank" rel="noopener">WhatsApp</a></div>` : '<span class="sub">—</span>'}</span></div>
      <div class="fijo" style="align-items:flex-start"><span class="dd">Dirección</span><span style="flex:1;min-width:0">${c.dir ? esc(c.dir) + `<br><a href="https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(c.dir)}" target="_blank" rel="noopener" style="color:var(--verdeT);font-weight:600;text-decoration:none">📍 Cómo llegar</a>` : '<span class="sub">—</span>'}</span></div>
      <div class="fijo" style="align-items:flex-start"><span class="dd">Precio</span><span class="num">${String(c.precio).replace(".",",")} € la hora${(c.hist||[]).length ? `<div class="sub">${c.hist.slice().reverse().map(x => `antes ${String(x.de).replace(".",",")} €, cambió el ${fCorta(x.f)}`).join("<br>")}</div>` : ""}</span></div>
      <div class="fijo"><span class="dd">Soléis ir</span><span>${personasTxt(c.personas||1)}</span></div>
      ${c.notas ? `<div class="nota">${esc(c.notas)}</div>` : ""}</div>
    <h2>Días fijos${Object.keys(c.dias||{}).length ? " · " + FREQ[c.freq||1].toLowerCase() : ""}</h2><div class="tarjeta">${Object.keys(c.dias||{}).sort().map(k => `<div class="fijo"><span class="dd">${c.freq==="mes" ? "1er " + DIAS[k].toLowerCase() : DIAS[k]}</span><span class="num">${c.dias[k][0]} – ${c.dias[k][1]}</span></div>`).join("") || `<div class="sub">Sin días fijos: solo trabajos sueltos.</div>`}</div>
    <h2>Trabajos hechos</h2>${hechosPorMes(c)}
    <button class="btn prin ancho" onclick="editarCliente('${c.id}')">✎ Editar cliente (nombre, datos y días)</button>
    <div style="text-align:center;margin-top:12px"><button class="btn suave" style="color:var(--rojoT)" onclick="borrarCliente('${c.id}')">Borrar cliente</button></div>`;
}
function vAjustes(){
  const dias = D.ultimaCopia ? Math.floor((Date.now() - D.ultimaCopia)/864e5) : null, cola = leerCola().length;
  const bloq = puedeAvisar() && Notification.permission === "denied";
  return `<div class="tarjeta" style="padding:4px 12px">
      <div class="opc" onclick="guardarCopia()"><span class="ic">⤓</span><span class="tx"><b>Guardar copia</b><span>${dias == null ? "Aún no has guardado ninguna" : dias === 0 ? "Última: hoy" : dias === 1 ? "Última: ayer" : "Última: hace " + dias + " días"}</span></span><span class="flecha">›</span></div>
      <label class="opc" style="margin:0;color:inherit;font-size:inherit"><span class="ic">⤒</span><span class="tx"><b>Recuperar una copia</b><span>Si cambias de móvil o se borra algo</span></span><span class="flecha">›</span><input type="file" accept=".json,application/json" style="display:none" onchange="recuperarCopia(this)"></label>
    </div>
    <div class="tarjeta" style="padding:4px 12px">
      <div class="opc" onclick="cambiarAvisos()"><span class="ic">🔔</span><span class="tx"><b>Avisarme si me olvido de terminar</b><span>Te llega una notificación 1 hora después de la hora de fin, y otra cada hora hasta que pulses ■</span></span><button class="sw ${D.avisos?"si":""}" aria-label="Avisos"></button></div>
    </div>
    ${!puedeAvisar() ? `<div class="nota">Este navegador no puede mandar notificaciones. Abre la app desde Chrome y añádela a la pantalla de inicio.</div>` : bloq ? `<div class="nota">Las notificaciones están bloqueadas para esta app. Actívalas en los ajustes del móvil (Notificaciones de Chrome).</div>` : ""}
    <div class="nota">Tus clientes y cuentas se guardan solo en este móvil. Haz una copia de vez en cuando.${cola ? ` Hay ${cola} aviso(s) esperando a tener internet.` : ""}</div>
    <div class="tarjeta" style="padding:4px 12px">
      <div class="opc peligro" onclick="borrarTodo()"><span class="ic">✕</span><span class="tx"><b>Borrar todo y empezar de cero</b><span>Clientes, trabajos y cobros</span></span><span class="flecha">›</span></div>
    </div>
    <div class="sub" style="text-align:center;margin-top:16px">Mis trabajos · v2</div>`;
}
pintar();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
